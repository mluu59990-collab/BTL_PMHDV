# Optional MySQL for development; existing local MySQL can be used via .env.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cms_nguonhang1688
      MYSQL_USER: cms
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cms}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-root}
    ports:
      - "3307:3306"
    volumes:
      - cms_mysqldata:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  cms_mysqldata:
