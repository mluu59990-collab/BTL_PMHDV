# Optional MySQL for development; existing local MySQL can be used via .env.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cms_logistics
      MYSQL_USER: cms
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cms}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-root}
    ports:
      - "3307:3306"
    volumes:
      - cms_mysqldata:/var/lib/mysql
      - ../sql/cms_logistics_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../sql/cms_logistics_procedures.sql:/docker-entrypoint-initdb.d/02_procedures.sql:ro
      - ../sql/cms_logistics_customers.sql:/docker-entrypoint-initdb.d/03_customers.sql:ro
      - ../sql/cms_logistics_orders.sql:/docker-entrypoint-initdb.d/04_orders.sql:ro
      - ../sql/cms_logistics_fulfillment.sql:/docker-entrypoint-initdb.d/05_fulfillment.sql:ro
      - ../sql/cms_logistics_payments.sql:/docker-entrypoint-initdb.d/06_payments.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  cms_mysqldata:
